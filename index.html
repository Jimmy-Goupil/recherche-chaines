<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recherche d'identifiant</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e1116;
      --card: #1a1f27;
      --line: #2c3440;
      --text: #f2f4f8;
      --muted: #9aa3b2;
      --accent: #3d8bfd;
      --id: #8dffb8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px 16px 40px;
    }
    h1 { font-size: 1.35rem; margin: 0 0 6px; }
    .hint { margin: 0 0 16px; color: var(--muted); line-height: 1.4; }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    button, input { font: inherit; }
    .tabs button, .result {
      min-height: 64px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
    }
    .tabs button { font-size: 1.05rem; font-weight: 700; }
    .tabs button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    #q {
      width: 100%;
      min-height: 64px;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #12161c;
      color: var(--text);
      font-size: 1.15rem;
    }
    #status { min-height: 1.4em; color: var(--muted); margin: 12px 4px; }
    #results { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
    .result { width: 100%; text-align: left; padding: 14px 16px; display: block; }
    .name { font-size: 1.15rem; font-weight: 700; line-height: 1.3; }
    .meta {
      margin-top: 8px;
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--id);
    }
    .small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <h1>Recherche d'identifiant</h1>
  <p class="hint">Choisis une liste, tape au moins 2 lettres, puis appuie sur un résultat pour copier le numéro.</p>

  <div class="tabs">
    <button type="button" data-list="live" class="active">Chaînes</button>
    <button type="button" data-list="movie">Films</button>
    <button type="button" data-list="series">Séries</button>
  </div>

  <input id="q" type="search" placeholder="Nom de la chaîne" autocomplete="off" enterkeyhint="search">
  <p id="status">Tape au moins 2 lettres.</p>
  <ul id="results"></ul>

  <script>
    var FILES = {
      live: "live.json",
      movie: "movie.json",
      series: "series.json"
    };
    var LABELS = {
      live: "chaînes",
      movie: "films",
      series: "séries"
    };

    var current = "live";
    var cache = {};
    var input = document.getElementById("q");
    var status = document.getElementById("status");
    var results = document.getElementById("results");
    var tabs = document.querySelectorAll(".tabs button");

    function norm(value) {
      return String(value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
    }

    function toList(data) {
      if (Array.isArray(data)) return data;
      if (data && typeof data === "object") {
        var keys = Object.keys(data);
        for (var i = 0; i < keys.length; i++) {
          if (Array.isArray(data[keys[i]])) return data[keys[i]];
        }
      }
      throw new Error("format");
    }

    function itemName(item) {
      return item.name || item.title || "(sans nom)";
    }

    function itemId(item, kind) {
      if (kind === "series" && item.series_id != null) return item.series_id;
      if (item.stream_id != null) return item.stream_id;
      if (item.series_id != null) return item.series_id;
      if (item.id != null) return item.id;
      return "";
    }

    function clearResults() {
      results.textContent = "";
    }

    function loadList(kind) {
      if (cache[kind]) return Promise.resolve(cache[kind]);
      status.textContent = "Chargement des " + LABELS[kind] + "…";
      return fetch(FILES[kind]).then(function (response) {
        if (!response.ok) throw new Error("missing");
        return response.text();
      }).then(function (text) {
        var trimmed = text.replace(/^\uFEFF/, "").trim();
        if (!trimmed || trimmed.charAt(0) === "<") throw new Error("html");
        cache[kind] = toList(JSON.parse(trimmed));
        return cache[kind];
      });
    }

    function showError(error) {
      clearResults();
      if (error && error.message === "missing") {
        status.textContent = "Fichier introuvable : " + FILES[current];
        return;
      }
      if (error && error.message === "html") {
        status.textContent = "Mauvais fichier. Il doit commencer par [ et non par une page web.";
        return;
      }
      status.textContent = "Impossible de lire " + FILES[current];
    }

    function copyId(id, label) {
      if (!id) return;
      var done = function () { label.textContent = "Copié : " + id; };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(String(id)).then(done).catch(function () {
          fallbackCopy(id);
          done();
        });
        return;
      }
      fallbackCopy(id);
      done();
    }

    function fallbackCopy(id) {
      var area = document.createElement("textarea");
      area.value = String(id);
      document.body.appendChild(area);
      area.select();
      document.execCommand("copy");
      area.remove();
    }

    function render() {
      var query = norm(input.value);
      var kind = current;
      clearResults();
      if (query.length < 2) {
        status.textContent = "Tape au moins 2 lettres.";
        return;
      }

      loadList(kind).then(function (list) {
        if (norm(input.value) !== query || current !== kind) return;

        var found = [];
        for (var i = 0; i < list.length; i++) {
          var item = list[i] || {};
          var name = itemName(item);
          var id = String(itemId(item, kind));
          if (norm(name).indexOf(query) !== -1 || norm(id).indexOf(query) !== -1) {
            found.push({ name: name, id: id });
            if (found.length === 40) break;
          }
        }

        var extra = kind === "series"
          ? " Ce numéro est celui de la série, pas d'un épisode."
          : "";
        status.textContent = found.length
          ? found.length + " résultat(s)." + extra
          : "Aucun résultat." + extra;

        found.forEach(function (item) {
          var li = document.createElement("li");
          var button = document.createElement("button");
          button.type = "button";
          button.className = "result";

          var name = document.createElement("div");
          name.className = "name";
          name.textContent = item.name;

          var meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent = "ID : " + (item.id || "?");

          var small = document.createElement("span");
          small.className = "small";
          small.textContent = "Appuyer pour copier";

          button.appendChild(name);
          button.appendChild(meta);
          button.appendChild(small);
          button.addEventListener("click", function () {
            copyId(item.id, small);
          });
          li.appendChild(button);
          results.appendChild(li);
        });
      }).catch(showError);
    }

    tabs.forEach(function (button) {
      button.addEventListener("click", function () {
        tabs.forEach(function (other) { other.classList.remove("active"); });
        button.classList.add("active");
        current = button.getAttribute("data-list");
        input.placeholder = current === "live" ? "Nom de la chaîne" : "Nom du titre";
        render();
      });
    });

    input.addEventListener("input", render);
  </script>
</body>
</html>
