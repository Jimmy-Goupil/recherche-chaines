<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recherche d'identifiant</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e1116;
      --card: #1a1f27;
      --line: #2c3440;
      --text: #f2f4f8;
      --muted: #c5ccd6;
      --accent: #3d8bfd;
      --ok: #8dffb8;
      --err: #ffb4b4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px 16px 48px;
    }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    .hint { margin: 0 0 16px; color: var(--muted); line-height: 1.4; }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    button, input { font: inherit; }
    .tabs button, #search, .hit {
      min-height: 56px;
      border-radius: 14px;
    }
    .tabs button {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      font-weight: 700;
    }
    .tabs button.active {
      background: var(--accent);
      border-color: var(--accent);
    }
    #search {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      padding: 0 16px;
      font-size: 1.1rem;
    }
    #status { min-height: 1.4em; color: var(--muted); }
    #status.ok { color: var(--ok); }
    #status.err { color: var(--err); font-weight: 700; }
    ul { list-style: none; margin: 12px 0 0; padding: 0; }
    .hit {
      width: 100%;
      margin: 0 0 8px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }
    .name { display: block; font-size: 1.05rem; font-weight: 700; }
    .copyline {
      display: block;
      margin-top: 6px;
      color: var(--ok);
      word-break: break-all;
    }
    .small { display: block; margin-top: 4px; color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Recherche d'identifiant</h1>
  <p class="hint">Choisis une liste, tape au moins 2 lettres, puis appuie sur un résultat. Le texte vert est copié.</p>
  <div class="tabs">
    <button type="button" data-file="live.json">Chaînes</button>
    <button type="button" data-file="movie.json">Films</button>
    <button type="button" data-file="series.json">Séries</button>
  </div>
  <input id="search" type="search" placeholder="Nom de la chaîne" autocomplete="off" enterkeyhint="search">
  <p id="status">Page prête.</p>
  <ul id="results"></ul>

  <script>
    var buttons = Array.prototype.slice.call(document.querySelectorAll(".tabs button"));
    var input = document.getElementById("search");
    var statusEl = document.getElementById("status");
    var results = document.getElementById("results");
    var cache = {};
    var currentFile = "live.json";

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = kind || "";
    }

    function norm(value) {
      return String(value || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function itemName(item) {
      return String(item.name || item.title || "");
    }

    function itemId(item) {
      if (item.series_id != null && item.series_id !== "") return String(item.series_id);
      if (item.stream_id != null && item.stream_id !== "") return String(item.stream_id);
      if (item.id != null && item.id !== "") return String(item.id);
      return "";
    }

    function copyValue(item) {
      var id = itemId(item);
      if (!id) return "";
      if (currentFile === "live.json") return id + ".ts";
      if (currentFile === "movie.json") return id + ".mkv";
      return "&action=get_series_info&series_id=" + id;
    }

    function clearResults() {
      results.innerHTML = "";
    }

    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text).catch(function () {
          return copyWithBox(text);
        });
      }
      return copyWithBox(text);
    }

    function copyWithBox(text) {
      var box = document.createElement("textarea");
      box.value = text;
      box.setAttribute("readonly", "");
      box.style.position = "fixed";
      box.style.left = "-9999px";
      document.body.appendChild(box);
      box.select();
      var ok = document.execCommand("copy");
      box.remove();
      if (!ok) return Promise.reject(new Error("copie impossible"));
      return Promise.resolve();
    }

    function loadList(file) {
      if (cache[file]) return Promise.resolve(cache[file]);
      return fetch(file + "?v=4").then(function (response) {
        if (!response.ok) throw new Error("Fichier introuvable : " + file);
        return response.text();
      }).then(function (text) {
        var clean = String(text || "").replace(/^\uFEFF/, "").trim();
        if (!clean || clean.charAt(0) === "<") {
          throw new Error("Mauvais fichier : " + file);
        }
        var data = JSON.parse(clean);
        if (!Array.isArray(data)) throw new Error("Impossible de lire " + file);
        cache[file] = data;
        return data;
      });
    }

    function showResults(list, query) {
      clearResults();
      var found = [];
      for (var i = 0; i < list.length; i++) {
        if (norm(itemName(list[i])).indexOf(query) !== -1) {
          found.push(list[i]);
          if (found.length === 50) break;
        }
      }
      if (!found.length) {
        setStatus("Aucun résultat.", "err");
        return;
      }
      setStatus(found.length + " résultat" + (found.length > 1 ? "s" : "") + " affiché" + (found.length > 1 ? "s" : "") + ".", "ok");
      found.forEach(function (item) {
        var text = copyValue(item);
        var li = document.createElement("li");
        var button = document.createElement("button");
        button.type = "button";
        button.className = "hit";

        var name = document.createElement("span");
        name.className = "name";
        name.textContent = itemName(item) || "Sans nom";

        var line = document.createElement("span");
        line.className = "copyline";
        line.textContent = text || "Pas d'identifiant";

        var small = document.createElement("span");
        small.className = "small";
        small.textContent = "Appuyer pour copier";

        button.appendChild(name);
        button.appendChild(line);
        button.appendChild(small);
        button.addEventListener("click", function () {
          if (!text) {
            setStatus("Cet élément n'a pas d'identifiant.", "err");
            return;
          }
          copyText(text).then(function () {
            small.textContent = "Copié";
            setStatus("Copié : " + text, "ok");
          }).catch(function () {
            setStatus("Copie impossible. Note ceci : " + text, "err");
          });
        });

        li.appendChild(button);
        results.appendChild(li);
      });
    }

    function refresh() {
      var query = norm(input.value);
      var file = currentFile;
      clearResults();
      setStatus("Chargement de " + file + "…");
      loadList(file).then(function (list) {
        if (file !== currentFile) return;
        if (query.length < 2) {
          setStatus(list.length + " éléments chargés. Tape au moins 2 lettres.", "ok");
          return;
        }
        if (norm(input.value) !== query) return;
        showResults(list, query);
      }).catch(function (error) {
        clearResults();
        setStatus(error.message || "Erreur de chargement.", "err");
      });
    }

    buttons.forEach(function (button) {
      button.addEventListener("click", function () {
        buttons.forEach(function (other) { other.classList.remove("active"); });
        button.classList.add("active");
        currentFile = button.getAttribute("data-file");
        input.placeholder = currentFile === "live.json" ? "Nom de la chaîne" : "Nom du titre";
        refresh();
      });
    });

    input.addEventListener("input", refresh);
    buttons[0].classList.add("active");
    refresh();
  </script>
</body>
</html>
